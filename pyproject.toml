[project]
name = "stamm-sdk"
version = "0.1.3"
description = "Python client SDK for Stamm federated learning registry"
readme = "README.md"
authors = [
    { name = "Santiago", email = "sam2800ml@gmail.com" }
]
requires-python = ">=3.12.0"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.5",
]

[project.scripts]
stamm-sdk = "stamm_sdk:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
